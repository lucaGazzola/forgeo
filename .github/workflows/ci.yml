name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Type check with mypy
        run: python -m mypy src/forgeo
      - name: Test with pytest
        run: python -m pytest

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: forgeo-linux-amd64
            binary: dist/forgeo
          - os: macos-15-intel
            asset: forgeo-darwin-amd64
            binary: dist/forgeo
          - os: macos-latest
            asset: forgeo-darwin-arm64
            binary: dist/forgeo
          - os: windows-latest
            asset: forgeo-windows-amd64.exe
            binary: dist/forgeo.exe
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and PyInstaller
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Build standalone binary
        run: pyinstaller forgeo.spec
      - name: Rename binary to release asset name
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build wheel and sdist
        run: python -m build
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          python - "${{ github.ref_name }}" <<'EOF'
          import re
          import sys
          import pathlib

          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\] .*?\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          notes = match.group(1).strip() if match else ""
          pathlib.Path("release-body.md").write_text(notes, encoding="utf-8")
          EOF
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            binaries/*
          body_path: release-body.md

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
