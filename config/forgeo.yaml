# Forgeo configuration.
# Everything is one flat file; relative paths resolve against this file's directory.
# Copy to your forgeo directory, run `forgeo validate --config forgeo.yaml` to
# check it is ready, then `forgeo start --config forgeo.yaml`.
#
# A running daemon watches this file and re-reads it on the next cycle when it
# changes (or on SIGHUP); an invalid change is logged and the last valid config
# stays in use. Changing the `repo`, `backlog`, `blocker_file` or `log_file`
# paths still needs `forgeo restart` (the daemon pins its lock files to the
# paths it started with).

name: my-forgeo                # Display name used in logs and commit messages.
repo: /path/to/repository       # The git repository the forgeo works on.
interval_minutes: 60            # How often the forgeo runs.
branch: main                    # Everything is committed to this branch (no feature branches).
remote: origin                  # Git remote to push to; omit to only commit locally.
# git_timeout_seconds: 120      # Kill a stuck git command after this many seconds
                                # (default 120). Raise for slow remotes.

backlog: backlog.json           # The task backlog (created on first use). Keep it
                                # outside the repository so it is never committed.
# backlog_provider: auto        # auto (legacy file/HTTP inference, or Jira when
                                # the `jira` block is present), file, http, or
                                # jira. Set to jira when `backlog` is a Jira
                                # base URL and configure the block below.
#
# The backlog can also live in another application instead of a file: set it to
# an http(s) URL and Forgeo reads the whole document with GET and writes it back
# with POST on every change (same JSON shape as backlog.json). The endpoint must
# replace its task list with the body it receives, never append.
#   backlog: https://api.example.com/api/forgeo/backlog
#   state_dir: .forgeo        # Where Forgeo's own runtime files go (locks, run
#                             # history, daemon state). Only needed with a URL
#                             # backlog, where there is no backlog file to sit
#                             # beside; defaults to this config's directory.
#
# Credentials for a backlog URL behind an identity provider (Keycloak, ...).
# Forgeo requests an access token with the OAuth2 client-credentials grant and
# sends it as a bearer on every backlog request, so it authenticates as a
# service account rather than as a person. The secret itself never goes in this
# file: client_secret_env names the environment variable holding it.
#   backlog_auth:
#     token_url: https://keycloak.example.com/realms/dev/protocol/openid-connect/token
#     client_id: forgeo
#     client_secret_env: FORGEO_BACKLOG_CLIENT_SECRET
#     scope: forgeo-backlog   # Optional.
#     timeout_seconds: 10     # Optional, default 10.
#
# Jira can be used directly instead of a JSON or HTTP backlog. Jira issue keys
# become task ids. Labels and a Jira issue property hold Forgeo's engine state;
# workflow status references may be names or (preferably) stable Jira ids.
#   backlog_provider: jira
#   backlog: https://jira.example.com
#   jira:
#     jql: 'project = APP AND labels = forgeo'
#     project_key: APP          # Required by the web console's Create action.
#     issue_type: Task
#     auth:
#       scheme: basic           # basic (Jira Cloud) or bearer (Server/DC PAT)
#       username_env: JIRA_USER # Required for basic auth.
#       token_env: JIRA_TOKEN
#     workflow:
#       open_statuses: ["10000", "10001"]
#       open_status: "10000"
#       running_status: "3"
#       completed_status: "10002"
#       blocked_status: null    # Optional workflow transition; a label is enough.
#       failed_status: null     # Optional; otherwise Forgeo uses a failed label.
#     fields:
#       acceptance_criteria: customfield_10042
#       dependencies: customfield_10043
#       files_to_modify: customfield_10044
#     claim_timeout_seconds: 86400
blocker_file: BLOCKER.md        # Written with a detailed explanation when the agent
                                # needs human input. Keep it outside the repository.
# run_history_keep: 2000        # How many finished runs runs.jsonl keeps; oldest
                                # lines are trimmed atomically on append. Set 0 to
                                # disable retention (file grows forever).
# run_output_lines: 200         # How many agent output lines each run record keeps
                                # in runs.jsonl (the bounded tail of the agent's
                                # stdout/stderr, shown in the web console History
                                # tab). Set 0 to stop persisting agent output.
# agent_response_lines: 200     # How many agent output lines the task's
                                # agent_response keeps on a status transition
                                # (the bounded tail of the agent's stdout/stderr,
                                # shown in the task modal and available to a
                                # backlog consumer). Omit = unbounded. Set 0 to
                                # stop persisting agent output on the task.

# Optional automatic retries for FAILED tasks. Transient failures (a network
# blip, a flaky test, a version hiccup) can succeed on a retry without a human.
# failed_retry_max: 0           # How many times a FAILED task is retried
                                # automatically. 0 (default) = a FAILED task
                                # stays FAILED until a human reopens it.
                                # A task can override this budget per-task with
                                # `retries_left` in the backlog.
# failed_retry_wait_cycles: 1   # How many cycles a retry-eligible FAILED task
                                # waits (backoff) before it is moved back to
                                # OPEN. Blocked tasks are never auto-retried.
# no_changes_retry_max: 2       # How many times a task whose agent exits 0
                                # without producing any code changes is re-run
                                # immediately, in the same cycle, before it is
                                # marked BLOCKED for human review. 0 (default)
                                # = a silent no-change SUCCESS is marked
                                # BLOCKED on the first attempt.

# The coding agent: any shell command. Read $FORGEO_TASK for the task, work in the
# repo directory, and exit with:
#   0 = success             (work is committed and pushed)
#   2 = needs human input   (BLOCKER.md is written; forgeo pauses)
#   3 = no changes needed   (task completes without a commit; explicit no-op)
#   other = error           (work is discarded, task marked FAILED)
#
# Exiting 0 with an unchanged working tree is NOT a valid no-op: the task is
# marked FAILED, because the engine cannot tell "deliberately did nothing"
# from "did nothing". Use exit code `no_changes_exit_code` to complete a task
# without touching the code.
agent_command: "aider --message \"$FORGEO_TASK\""
# agent_timeout_seconds: 3600   # Optional escape hatch: kill a stuck agent after
                                # this many seconds. Omitted = never kill; an
                                # overlong run just skips the next iteration.
agent_env: {}                 # Extra environment variables for the agent process.
blocked_exit_code: 2
no_changes_exit_code: 3

# Optional: path to a file whose contents are prepended to every agent
# instruction (tasks and refactoring runs alike). This gives the agent the
# high-level project overview (e.g. CONTEXT.md) before the task, instead of
# only the isolated task description. The file is re-read on every run, so
# the agent's own updates to it are picked up on the next cycle; a missing or
# unreadable file is a `forgeo validate` warning and the cycle runs without it.
# task_context: CONTEXT.md

# Optional: isolate the agent in a Docker sandbox instead of running it on the
# host with the user's full privileges. The default `none` runs the agent
# exactly as before. Set `docker` to run it inside `docker run --rm` with the
# repo mounted at the same absolute path, `FORGEO_TASK`/`agent_env` passed
# through, and networking disabled. The exit-code contract is unchanged.
#   agent_sandbox: docker     # 'none' (default) | 'docker'
#   agent_sandbox_image: forgeo-agent
#                             # REQUIRED when sandbox is 'docker'. The image
#                             # must contain the agent CLI you use in
#                             # agent_command (e.g. `claude`/`opencode`) and a
#                             # POSIX shell (`sh`) for string commands.
#   agent_sandbox_network: none
#                             # Docker network for the container. 'none'
#                             # (default) disables networking; set to e.g.
#                             # 'bridge' or 'host' to re-enable it.
#   agent_sandbox_mounts:     # Optional: host paths (agent credentials/config)
#     - ~/.claude             # mounted read-only into the container at the same
#     - ~/.config/claude      # path. Nothing is mounted unless listed here.

# Instruction used when the backlog has no runnable task: the forgeo refactors.
refactor_prompt: |
  Review the codebase for improvement opportunities that do not change
  behavior: dead code, duplication, overly complex functions, missing
  tests, outdated comments. Apply the safe improvements you find and run
  the test suite to verify nothing broke. If nothing needs refactoring,
  make no changes.

log_file: forgeo.log

# Optional Telegram notifications when a task (or refactoring pass) turns
# BLOCKED. Set both keys to enable; omit to disable. The message includes the
# forgeo name, the task id and title, and the first lines of the blocker
# reason. Uses the stdlib only; a failed notification never affects the run.
# telegram_bot_token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# telegram_chat_id: "-1001234567890"

# Optional vendor-neutral webhook notifications (Slack, Discord, ntfy, ...):
# a JSON POST per run outcome with the forgeo name, outcome, task id/title,
# and reason. The URL alone enables blocked-run notifications; add outcomes
# to notify_webhook_events to report them too. A failed/unreachable webhook
# is logged as a warning and never affects the run.
# notify_webhook_url: "https://hooks.example.com/forgeo"
# notify_webhook_events:
#   - blocked        # default: blocked only
#   - completed
#   - failed
