site_name: Forgeo
site_description: A scheduled, agent-driven software factory for your coding agent — backlog-driven, single-branch, with a web dashboard.
site_url: https://forgeo.org/docs/
repo_url: https://github.com/lucaGazzola/forgeo
repo_name: lucaGazzola/forgeo
site_dir: site
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.magiclink

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Backlog format: backlog.md
  - Agent contract: agent-contract.md
  - CLI reference: cli-reference.md
  - Web console & HTTP API: web-console-api.md
