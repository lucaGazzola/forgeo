[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeo-cli"
version = "0.12.0"
description = "A scheduled software forgeo: executes backlog tasks on main, refactors when idle, and writes BLOCKER.md when it needs human input."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Forgeo Contributors" }]
keywords = ["automation", "agents", "backlog", "orchestration", "scheduler", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.5",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://forgeo.org"
Documentation = "https://forgeo.org"
Repository = "https://github.com/lucaGazzola/forgeo"
Issues = "https://github.com/lucaGazzola/forgeo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
forgeo = "forgeo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["forgeo"]
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
